<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0c6d59">
  <meta name="description" content="XL Billing — sales, purchases, parties and payments for your business.">
  <title>XL Billing</title>
  <style>:root {
  --primary:#0c6d59;
  --primary-dark:#075341;
  --primary-soft:#e8f4ee;
  --ink:#172e29;
  --muted:#6d7c76;
  --border:#dce5df;
  --paper:#fff;
  --background:#f3f5f8;
  --orange:#a76421;
  --danger:#b23d37;
  --blue:#346695;
  --sidebar:220px;
  --radius:8px;
  --shadow:none;
  font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:var(--ink);
  font-size:14px;
  line-height:1.5;
  font-synthesis:none;
}

* {
  box-sizing:border-box;
}

body {
  margin:0;
  background:var(--background);
}

button,input,select,textarea {
  font:inherit;
}

button,a,input,select,textarea {
  -webkit-tap-highlight-color:transparent;
}

button {
  cursor:pointer;
}

a {
  color:inherit;
  text-decoration:none;
}

button:disabled {
  opacity:.55;
  cursor:wait;
}

button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible {
  outline:3px solid #76baa7;
  outline-offset:3px;
}

h1,h2,h3,p {
  margin:0;
}

h1 {
  font-size:23px;
  line-height:1.25;
  font-weight:700;
  letter-spacing:-.4px;
}

h2 {
  font-size:17px;
  line-height:1.4;
}

h3 {
  font-size:15px;
}

small {
  font-size:12px;
}

input,select,textarea {
  width:100%;
  min-height:42px;
  border:1px solid #d5dfd8;
  border-radius:7px;
  padding:9px 11px;
  background:white;
  color:var(--ink);
}

textarea {
  resize:vertical;
}

input:focus,select:focus,textarea:focus {
  border-color:var(--primary);
}

input[readonly] {
  background:#f3f5f3;
  color:var(--muted);
}

input[type=number] {
  appearance:textfield;
}

input::-webkit-inner-spin-button {
  appearance:none;
}

input[type=checkbox] {
  width:17px;
  min-height:17px;
  accent-color:var(--primary);
}

input[type=file] {
  font-size:12px;
}

input[type=file]::file-selector-button {
  border:0;
  border-radius:4px;
  padding:6px 10px;
  margin-right:8px;
  color:var(--primary);
  background:var(--primary-soft);
}

.skip-link {
  position:fixed;
  left:20px;
  top:-100px;
  padding:12px;
  background:white;
  z-index:999;
}

.skip-link:focus {
  top:16px;
}

.visually-hidden {
  position:absolute;
  width:1px;
  height:1px;
  overflow:hidden;
  clip:rect(0,0,0,0);
  white-space:nowrap;
}

.muted {
  color:var(--muted);
}

.tiny {
  font-size:12px;
}

.number {
  text-align:right;
  font-variant-numeric:tabular-nums;
  white-space:nowrap;
}

.warning-text {
  color:var(--orange);
}

.actions,.row-actions {
  display:flex;
  gap:8px;
  align-items:center;
}

.wrap {
  flex-wrap:wrap;
}

.button {
  min-height:40px;
  display:inline-flex;
  justify-content:center;
  align-items:center;
  gap:7px;
  border-radius:7px;
  border:1px solid transparent;
  padding:9px 14px;
  font-size:13px;
  font-weight:600;
  background:#eef2ee;
  color:var(--ink);
  white-space:nowrap;
}

.button.primary {
  background:var(--primary);
  color:white;
  box-shadow:0 2px 4px #0c6d5915;
}

.button.primary:hover {
  background:var(--primary-dark);
}

.button.secondary {
  background:var(--primary-soft);
  border-color:#cadfd3;
  color:var(--primary);
}

.button.subtle {
  background:white;
  border-color:var(--border);
  color:#4e6259;
}

.button.subtle:hover {
  background:#f0f5f0;
}

.button.danger {
  color:var(--danger);
}

.button.icon {
  padding:3px 8px;
  min-height:30px;
  font-size:12px;
  background:#f4f6f3;
}

.text-button {
  border:0;
  background:none;
  color:var(--primary);
  font-weight:650;
  padding:0;
  text-align:left;
}

.text-button:hover {
  text-decoration:underline;
}

.badge {
  display:inline-block;
  font-size:11px;
  font-weight:650;
  line-height:1.5;
  padding:4px 9px;
  border-radius:5px;
  white-space:nowrap;
  background:#eef2ee;
  color:#55655b;
}

.badge.paid {
  color:var(--primary);
  background:var(--primary-soft);
}

.badge.unpaid {
  background:#faf0e0;
  color:var(--orange);
}

.badge.cancelled {
  background:#f9e9e8;
  color:var(--danger);
}

.badge.draft {
  background:#edf0f4;
  color:#63758a;
}

.badge.neutral {
  background:#eef3ef;
  color:#607369;
}

.sidebar {
  position:fixed;
  inset:0 auto 0 0;
  width:var(--sidebar);
  background:#fff;
  border-right:1px solid var(--border);
  display:flex;
  flex-direction:column;
  z-index:40;
}

.brand {
  display:flex;
  align-items:center;
  gap:11px;
  margin:20px 18px;
  font-size:18px;
  font-weight:750;
  line-height:1.15;
}

.brand-mark {
  background:var(--primary);
  color:white;
  border-radius:10px;
  width:40px;
  height:42px;
  display:grid;
  place-items:center;
  font-size:20px;
  letter-spacing:-1px;
}

.brand small {
  display:block;
  font-size:10px;
  color:var(--muted);
  font-weight:450;
  letter-spacing:.3px;
  margin-top:5px;
}

#desktop-navigation {
  overflow:auto;
  flex:1;
  padding:0 12px 20px;
}

.nav-group {
  margin-bottom:12px;
}

.nav-group>small {
  font-size:9px;
  font-weight:750;
  letter-spacing:1.2px;
  color:#929f94;
  display:block;
  margin:0 14px 6px;
}

.nav-group a {
  display:block;
  min-height:39px;
  font-size:13px;
  font-weight:550;
  border-radius:7px;
  padding:10px 14px;
  color:#66756b;
}

.nav-group a:hover {
  background:#f3f6f2;
}

.nav-group a[aria-current] {
  color:var(--primary);
  background:var(--primary-soft);
  font-weight:700;
}

.sidebar-footer {
  padding:17px 25px;
  border-top:1px solid var(--border);
  font-size:11px;
  color:var(--muted);
  display:flex;
  gap:9px;
  align-items:center;
}

.connection-dot {
  height:7px;
  width:7px;
  border-radius:50%;
  background:#9aa69d;
}

.connection-dot.synced {
  background:var(--primary);
}

.connection-dot.pending,.connection-dot.error {
  background:var(--orange);
}

.workspace {
  margin-left:var(--sidebar);
  min-width:0;
}

.topbar {
  height:62px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:0 24px;
  background:white;
  border-bottom:1px solid var(--border);
}

.topbar-left,.topbar-actions {
  display:flex;
  align-items:center;
  gap:16px;
}

.topbar-left strong {
  font-size:14px;
}

.topbar-left small {
  display:block;
  color:var(--muted);
  font-size:10px;
  letter-spacing:.5px;
}

.sync-pill {
  font-size:11px;
  font-weight:600;
  border:1px solid var(--border);
  border-radius:30px;
  padding:7px 12px;
  background:#fff;
  color:var(--muted);
  min-height:35px;
}

.sync-pill.synced {
  color:var(--primary);
  border-color:#c8e1d1;
  background:#f3faf4;
}

.sync-pill.pending,.sync-pill.error {
  color:var(--orange);
  background:#fff6e7;
  border-color:#eed6ab;
}

.mobile-menu,.drawer-backdrop,.mobile-navigation {
  display:none;
}

.view {
  padding:20px 24px 50px;
  max-width:1650px;
  margin:0 auto;
  outline:none;
}

.page-head {
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
  margin-bottom:18px;
}

.page-head p {
  color:var(--muted);
  margin-top:4px;
  font-size:13px;
}

.card {
  padding:18px;
  background:white;
  border:1px solid var(--border);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  margin-bottom:16px;
}

.section-title {
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:14px;
  margin-bottom:12px;
}

.section-title p {
  font-size:12px;
  margin-top:4px;
}

.info-strip {
  background:#edf2ed;
  color:#617365;
  padding:12px 15px;
  border-radius:7px;
  font-size:12px;
  margin-top:15px;
}

.status-banner {
  margin:18px 34px 0;
  padding:12px 16px;
  background:#fff0db;
  border:1px solid #efd4a8;
  border-radius:7px;
  color:#8b5b26;
  font-size:12px;
}

.status-banner[hidden] {
  display:none;
}

.stat-grid {
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:17px;
  margin-bottom:24px;
}

.stat-card {
  background:white;
  border:1px solid var(--border);
  border-top:3px solid #4c9c70;
  border-radius:11px;
  padding:18px 20px;
  box-shadow:var(--shadow);
  min-width:0;
}

.stat-card>span {
  color:#738477;
  font-size:12px;
  display:block;
}

.stat-card>strong {
  font-size:25px;
  letter-spacing:-.6px;
  display:block;
  margin:10px 0 6px;
  overflow-wrap:anywhere;
}

.stat-card>small {
  color:#8b998e;
  font-size:11px;
}

.stat-card.orange {
  border-top-color:#d8a158;
}

.stat-card.blue {
  border-top-color:#78a4c2;
}

.stat-card.plain {
  border-top-color:#9cae93;
}

.quick-grid {
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:14px;
  margin-bottom:18px;
}

.quick-card {
  text-align:left;
  background:#eff5ee;
  border:1px solid #d7e3d6;
  border-radius:9px;
  padding:16px 20px;
  position:relative;
  color:var(--ink);
  min-height:93px;
}

.quick-card strong {
  display:block;
  font-size:13px;
  margin-bottom:5px;
}

.quick-card>span:not(.arrow) {
  display:block;
  color:#7c8a7b;
  font-size:11px;
  max-width:150px;
}

.quick-card .arrow {
  position:absolute;
  right:16px;
  top:16px;
  color:var(--primary);
}

.quick-card:hover {
  background:#e5f0e5;
}

.field {
  display:flex;
  flex-direction:column;
  gap:6px;
  min-width:0;
}

.field>span {
  font-size:12px;
  font-weight:550;
  color:#6b7e70;
}

.field small {
  color:var(--muted);
  font-size:11px;
}

.form-grid {
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:16px;
}

.span-2 {
  grid-column:span 2;
}

.filter-bar {
  display:flex;
  gap:12px;
  align-items:end;
  flex-wrap:wrap;
  margin-bottom:19px;
}

.filter-bar>.field:first-child {
  flex:1;
  min-width:190px;
}

.filter-bar>.field:not(:first-child) {
  width:150px;
}

.filter-bar input,.filter-bar select {
  font-size:12px;
}

.list-summary {
  display:flex;
  justify-content:space-between;
  font-size:12px;
  padding:0 1px 16px;
  color:var(--muted);
}

.list-summary strong {
  color:var(--ink);
}

.table-wrap {
  overflow-x:auto;
  max-width:100%;
}

table {
  border-collapse:collapse;
  width:100%;
  font-size:13px;
}

thead {
  background:#f6f8f4;
  border-top:1px solid #e9eee7;
  border-bottom:1px solid var(--border);
}

th {
  font-size:10px;
  font-weight:650;
  color:#7d8c7f;
  text-align:left;
  text-transform:uppercase;
  letter-spacing:.4px;
  padding:12px;
}

td {
  padding:16px 12px;
  border-bottom:1px solid #edf1eb;
  vertical-align:middle;
}

td strong {
  font-size:13px;
  font-weight:600;
}

td small {
  display:block;
  font-size:11px;
  color:#8b978c;
  margin-top:4px;
  max-width:250px;
  white-space:normal;
}

tbody tr:last-child td {
  border-bottom:none;
}

.row-actions {
  gap:6px;
  flex-wrap:wrap;
}

.row-actions .button {
  padding:6px 10px;
  font-size:11px;
  min-height:32px;
}

.pagination {
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-top:1px solid var(--border);
  padding-top:17px;
  margin-top:12px;
  font-size:11px;
  color:var(--muted);
}

.pagination .button {
  min-height:32px;
  padding:5px 10px;
  font-size:11px;
}

.empty {
  text-align:center;
  padding:44px 16px;
  color:var(--muted);
}

.empty h3 {
  color:var(--ink);
  font-size:16px;
  margin:12px 0 6px;
}

.empty p {
  font-size:13px;
  max-width:430px;
  margin:0 auto;
}

.empty-mark {
  width:42px;
  height:42px;
  display:grid;
  place-items:center;
  margin:0 auto;
  border-radius:10px;
  background:var(--primary-soft);
  color:var(--primary);
  font-weight:700;
  font-size:16px;
}

.empty .button {
  margin-top:14px;
}

.editor {
  padding-bottom:72px;
}

.invoice-line {
  display:grid;
  grid-template-columns:minmax(170px,2.8fr) minmax(64px,.85fr) 80px 54px 70px 84px 92px 74px;
  align-items:start;
  gap:8px;
  border-bottom:1px solid #e9eee7;
  padding:10px 8px;
}

.invoice-line:last-child {
  border-bottom:none;
}

.invoice-line .field input,.invoice-line .field select {
  padding:8px 9px;
  min-height:39px;
  font-size:12px;
}

.line-name {
  position:relative;
  padding-left:23px;
}

.line-number {
  position:absolute;
  left:0;
  top:31px;
  color:#9aa89b;
  font-size:11px;
}

.history-hint {
  margin-top:5px;
  line-height:1.3;
  min-height:17px;
}

.last-price {
  background:none;
  padding:0;
  border:0;
  font-size:10px;
  text-align:left;
  color:var(--primary);
  font-weight:600;
}

.last-price span {
  color:#8b9a8f;
  font-weight:450;
}

.line-amount {
  padding-top:0;
  text-align:right;
}

.line-amount>span {
  display:block;
  color:#6b7e70;
  font-size:12px;
  margin-bottom:6px;
}

.line-amount strong {
  display:block;
  font-size:13px;
  padding-top:9px;
}

.line-controls {
  display:flex;
  flex-wrap:wrap;
  gap:3px;
  align-items:center;
  padding-top:25px;
  justify-content:flex-end;
}

.summary {
  margin:22px 0 2px;
  margin-left:auto;
  max-width:350px;
  padding:17px 20px;
  background:#f5f8f2;
  border-radius:9px;
}

.summary>div {
  display:flex;
  justify-content:space-between;
  padding:5px 0;
  font-size:12px;
  color:var(--muted);
}

.summary strong {
  color:var(--ink);
  font-size:13px;
}

.summary .total {
  border-top:1px solid #d9e5d6;
  padding-top:12px;
  margin-top:7px;
  font-size:15px;
}

.summary .total strong {
  font-size:18px;
  color:var(--primary);
}

.form-error {
  font-size:12px;
  color:var(--danger);
  margin:12px 0;
}

.form-error:empty {
  display:none;
}

.save-bar {
  position:fixed;
  bottom:0;
  left:var(--sidebar);
  right:0;
  background:#fffffff5;
  backdrop-filter:blur(10px);
  border-top:1px solid var(--border);
  padding:10px 24px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  z-index:30;
}

.save-bar small {
  display:block;
  color:var(--muted);
  font-size:10px;
}

.save-bar strong {
  font-size:19px;
  color:var(--primary);
}

.bulk-row {
  display:grid;
  grid-template-columns:140px 1fr 120px 120px 1.3fr auto;
  gap:12px;
  padding:17px 0;
  border-bottom:1px solid var(--border);
  align-items:end;
}

.bulk-row .button {
  min-height:42px;
}

.custom-row {
  display:grid;
  grid-template-columns:1fr 160px auto;
  gap:14px;
  align-items:end;
  margin-bottom:14px;
}

.checkbox-grid {
  display:flex;
  gap:20px;
  flex-wrap:wrap;
  margin-top:22px;
}

.check {
  display:flex;
  gap:9px;
  align-items:center;
  font-size:12px;
  color:var(--muted);
}

.dialog {
  border:1px solid var(--border);
  border-radius:14px;
  width:min(590px,calc(100% - 32px));
  max-height:90dvh;
  padding:0;
  box-shadow:0 20px 100px #09241933;
  background:white;
  color:var(--ink);
}

.dialog.wide {
  width:min(1000px,calc(100% - 40px));
}

.dialog::backdrop {
  background:#122c295c;
  backdrop-filter:blur(2px);
}

.dialog-head {
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid var(--border);
  padding:20px 24px;
  position:sticky;
  top:0;
  background:white;
  z-index:3;
}

.dialog-head small {
  display:block;
  font-size:9px;
  color:var(--primary);
  letter-spacing:1.3px;
  margin-bottom:4px;
}

.dialog-body {
  padding:24px;
}

.dialog .form-grid {
  grid-template-columns:repeat(2,minmax(0,1fr));
}

.dialog-actions {
  display:flex;
  justify-content:flex-end;
  gap:9px;
  margin-top:22px;
  border-top:1px solid var(--border);
  padding-top:18px;
}

.detail-heading {
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:22px;
  gap:15px;
}

.detail-heading p {
  font-size:12px;
  color:var(--muted);
  margin-top:4px;
}

.detail-metrics {
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  background:#f4f7f1;
  padding:17px;
  border-radius:8px;
  margin-bottom:20px;
}

.detail-metrics span {
  display:block;
  font-size:11px;
  color:var(--muted);
}

.detail-metrics strong {
  font-size:20px;
}

.dialog .table-wrap {
  margin-top:20px;
}

.detail-summary {
  display:flex;
  gap:18px;
  justify-content:flex-end;
  margin:16px 0;
  font-size:12px;
  color:var(--muted);
  flex-wrap:wrap;
}

.subheading {
  margin:24px 0 13px;
}

.notes {
  white-space:pre-wrap;
  color:var(--muted);
  font-size:13px;
  padding:16px 0;
}

.payment-history>div,.price-options>div {
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  padding:13px 0;
  border-bottom:1px solid var(--border);
}

.payment-history>div>span,.price-options>div>span {
  flex:1;
}

.payment-history small,.price-options small {
  display:block;
  color:var(--muted);
  font-size:11px;
  margin-top:4px;
}

.allocation-row {
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
  padding:12px 0;
  border-bottom:1px solid var(--border);
}

.allocation-row input {
  width:145px;
  text-align:right;
}

.allocation-row small {
  display:block;
  color:var(--muted);
  font-size:11px;
  margin-top:4px;
}

.ledger-balance {
  text-align:right;
}

.ledger-balance small {
  display:block;
  color:var(--muted);
}

.ledger-balance strong {
  font-size:23px;
  color:var(--primary);
}

  const cards = [['Total sales', saleTotal, `${invoices.length} invoices + ${retail.length} retail entries`, ''], ['To collect', receive, 'Pending invoice balances', 'orange'], ['To pay', pay, `${purchases.length} purchase bills`, 'blue'], ['Pending dispatch', pending, 'Invoices waiting to go out', 'plain']];

function renderDocuments(state, collection, filter) {
  const sale = collection === 'invoices';
  const rows = state[collection].filter(d => !d.deletedAt && match(d, filter)).filter(d => !filter.status || filter.status === 'All' || (filter.status === 'Cancelled' ? !active(d) : filter.status === 'Draft' ? d.dispatchStatus === 'draft' : filter.status === 'Paid' ? active(d) && d.dispatchStatus !== 'draft' && d.balance <= 0 : filter.status === 'Unpaid' ? active(d) && d.dispatchStatus !== 'draft' && d.balance > 0 : filter.status === 'Pending dispatch' ? active(d) && d.dispatchStatus === 'pending' : d.dispatchStatus === 'dispatched')).sort((a, b) => b.date.localeCompare(a.date) || (b.createdAt || '').localeCompare(a.createdAt || ''));
  const page = pager(rows, filter);
  const total = rows.filter(d => active(d) && d.dispatchStatus !== 'draft').reduce((sum, d) => sum + Number(d.total), 0);
  return `${pageHead(sale ? 'Sale invoices' : 'Purchase bills', 'Search, edit, print and settle your bills.', button('Export CSV', 'export-csv', `data-type="${collection}"`, 'subtle') + button('Bulk / previous bills', 'navigate', `data-page="${sale ? 'bulk-sales' : 'bulk-purchases'}"`, 'secondary') + button(sale ? 'New sale' : 'New purchase', 'navigate', `data-page="${sale ? 'new-sale' : 'new-purchase'}"`, 'primary'))}<section class="card">${filterBar(filter, sale ? ['All', 'Unpaid', 'Paid', 'Draft', 'Pending dispatch', 'Dispatched', 'Cancelled'] : ['All', 'Unpaid', 'Paid', 'Cancelled'])}<div class="list-summary"><span>${rows.length} matching bills</span><strong>Total ${currency(total)}</strong></div>${documentTable(page.rows, collection)}${page.html}</section>`;
}
function renderMasters(state, collection, filter) {
  const parties = collection === 'parties';
  const archived = filter.status === 'Archived';
  const rows = state[collection].filter(row => Boolean(row.deletedAt) === archived && match(row, filter)).sort((a, b) => a.name.localeCompare(b.name));
  const page = pager(rows, filter);
  return `${pageHead(parties ? 'Parties' : 'Items', parties ? 'Customers, suppliers and their complete transaction history.' : 'Your product catalogue, rates and packing units.', button('Export CSV', 'export-csv', `data-type="${collection}"`, 'subtle') + button(parties ? 'Add party' : 'Add item', 'edit-master', `data-kind="${collection}"`, 'primary'))}<section class="card"><div class="filter-bar">${field('Search', 'search', filter.search || '', 'id="list-search" data-filter="search" type="search" placeholder="Search by name…"')}<label class="field"><span>Records</span><select data-filter="status">${options(['Active', 'Archived'], filter.status || 'Active')}</select></label></div>${rows.length ? `<div class="table-wrap"><table class="responsive-table"><thead><tr><th>Name</th>${parties ? '<th>Contact</th><th>Type</th><th class="number">Net balance</th>' : '<th>Unit / HSN</th><th class="number">Sale price</th><th class="number">Purchase price</th>'}<th>Actions</th></tr></thead><tbody>${page.rows.map(row => `<tr><td data-label="Name"><strong>${e(row.name)}</strong><small>${e(parties ? row.gstin : row.colour || row.brand || row.sku)}</small></td>${parties ? `<td data-label="Contact">${e(row.phone || '—')}<small>${e(row.address)}</small></td><td data-label="Type">${e(row.type || 'both')}</td><td class="number" data-label="Balance">${currency(Math.abs(partyBalance(state, row)))}<small>${partyBalance(state, row) >= 0 ? 'To collect' : 'To pay'}</small></td>` : `<td data-label="Unit">${e(row.unit || 'Pcs')}<small>${e(row.hsn)}</small></td><td class="number" data-label="Sale price">${currency(row.saleRate)}</td><td class="number" data-label="Purchase price">${currency(row.purchaseRate)}</td>`}<td data-label="Actions"><div class="row-actions">${archived ? button('Restore', 'restore-master', `data-kind="${collection}" data-id="${e(row.id)}"`, 'secondary') : (parties ? button('Ledger', 'party-ledger', `data-id="${e(row.id)}"`, 'secondary') : '') + button('Edit', 'edit-master', `data-kind="${collection}" data-id="${e(row.id)}"`, 'subtle') + button('Archive', 'archive-master', `data-kind="${collection}" data-id="${e(row.id)}"`, 'subtle danger')}</div></td></tr>`).join('')}</tbody></table></div>` : empty(archived ? 'No archived records' : parties ? 'Add your first party' : 'Add your first item', 'Use the add button above or import a CSV from Data & Sync.')}${page.html}</section>`;
}
function renderTransactions(state, filter, mode = 'all') {
  const rows = transactions(state).filter(row => match(row, filter) && (mode === 'all' || mode === 'in' && row.type === 'Payment in' || mode === 'out' && row.type === 'Payment out'));
  const page = pager(rows, filter);
  return `${pageHead(mode === 'all' ? 'Transactions' : mode === 'in' ? 'Payment in' : 'Payment out', 'Track money movement and the bills behind it.', button('Export CSV', 'export-csv', 'data-type="transactions"', 'subtle') + (mode !== 'all' ? button('Record payment', 'open-payment', `data-direction="${mode}"`, 'primary') : ''))}<section class="card">${filterBar(filter)}${page.rows.length ? `<div class="table-wrap"><table class="responsive-table"><thead><tr><th>Date / type</th><th>Party</th><th>Reference</th><th class="number">Amount</th><th>Mode / note</th></tr></thead><tbody>${page.rows.map(row => `<tr><td data-label="Date">${dateLabel(row.date)}<small>${e(row.type)}${row.cancelled ? ' · cancelled bill' : ''}</small></td><td data-label="Party">${e(row.partyName)}</td><td data-label="Reference">${row.collection ? `<button class="text-button" data-action="view-document" data-kind="${row.collection}" data-id="${e(row.documentId || row.id)}">${e(row.reference)}</button>` : e(row.reference)}</td><td class="number" data-label="Amount">${currency(row.amount)}</td><td data-label="Mode">${e(row.mode || '—')}<small>${e(row.note)}</small></td></tr>`).join('')}</tbody></table></div>` : empty('No matching transactions', 'Record your first sale, purchase or payment.')}${page.html}</section>`;
}
function renderRetail(state, filter) {
  const archived = filter.status === 'Archived';
  const rows = state.retail.filter(row => Boolean(row.deletedAt) === archived && match(row, filter)).sort((a, b) => b.date.localeCompare(a.date));
  const page = pager(rows, filter);
  return `${pageHead('Retail sales', 'A quick daily entry for counter sales.')}<form id="retail-form" class="card"><div class="form-grid">${field('Date', 'date', today(), 'type="date" required')}${field('Amount', 'amount', '', 'type="number" min="0.01" step="0.01" inputmode="decimal" required')}${field('Notes', 'notes', '', 'placeholder="Cash / UPI / daily total"')}<div class="field"><span>&nbsp;</span><button type="submit" class="button primary">Save retail sale</button></div></div></form><section class="card">${filterBar(filter, ['All', 'Archived'])}<div class="list-summary"><span>${rows.length} entries</span><strong>${currency(rows.reduce((sum, row) => sum + Number(row.amount), 0))}</strong></div>${rows.length ? `<div class="table-wrap"><table class="responsive-table"><thead><tr><th>Date</th><th>Notes</th><th class="number">Amount</th><th>Action</th></tr></thead><tbody>${page.rows.map(row => `<tr><td data-label="Date">${dateLabel(row.date)}</td><td data-label="Notes">${e(row.notes)}</td><td class="number" data-label="Amount">${currency(row.amount)}</td><td data-label="Action">${button(archived ? 'Restore' : 'Archive', archived ? 'restore-master' : 'archive-master', `data-kind="retail" data-id="${e(row.id)}"`, 'subtle')}</td></tr>`).join('')}</tbody></table></div>` : empty('No retail entries')}${page.html}</section>`;
}
function renderReports(state, filter) {
  const sales = state.invoices.filter(d => active(d) && d.dispatchStatus !== 'draft' && match(d, filter));
  const purchases = state.purchases.filter(d => active(d) && match(d, filter));
  const retail = state.retail.filter(d => active(d) && match(d, filter));
  const itemMap = new Map();
  for (const doc of sales) for (const item of doc.items || []) {
    const id = `${item.itemId || item.name}|${item.unit || 'Pcs'}|${item.colour || ''}`;
    const row = itemMap.get(id) || { name: item.name, unit: item.unit || 'Pcs', qty: 0, amount: 0 };
    row.qty += Number(item.qty || 0); row.amount += Number(item.amt ?? Number(item.qty || 0) * Number(item.rate || 0)); itemMap.set(id, row);
  }
  const itemPage = pager([...itemMap.values()].sort((a, b) => b.amount - a.amount), filter);
  return `${pageHead('Reports', 'Sales, purchases, item movement and pending balances.', button('Export transactions', 'export-csv', 'data-type="transactions"', 'secondary'))}<section class="card">${filterBar(filter)}<div class="stat-grid"><div class="stat-card"><span>Wholesale sales</span><strong>${currency(sales.reduce((s, d) => s + Number(d.total), 0))}</strong><small>${sales.length} invoices</small></div><div class="stat-card blue"><span>Purchases</span><strong>${currency(purchases.reduce((s, d) => s + Number(d.total), 0))}</strong><small>${purchases.length} bills</small></div><div class="stat-card orange"><span>Retail sales</span><strong>${currency(retail.reduce((s, d) => s + Number(d.amount), 0))}</strong><small>${retail.length} entries</small></div><div class="stat-card"><span>Sales including retail</span><strong>${currency(sales.reduce((s, d) => s + Number(d.total), 0) + retail.reduce((s, d) => s + Number(d.amount), 0))}</strong><small>For the selected period</small></div></div></section><section class="card"><div class="section-title"><h2>Item-wise sales</h2></div>${itemMap.size ? `<div class="table-wrap"><table class="responsive-table"><thead><tr><th>Item</th><th class="number">Quantity</th><th class="number">Sales before bill discount / tax</th></tr></thead><tbody>${itemPage.rows.map(row => `<tr><td data-label="Item">${e(row.name)}</td><td class="number" data-label="Quantity">${row.qty.toLocaleString('en-IN')} ${e(row.unit)}</td><td class="number" data-label="Value">${currency(row.amount)}</td></tr>`).join('')}</tbody></table></div>` : empty('No item sales in this period')}${itemPage.html}</section><section class="card"><div class="section-title"><h2>Pending collections</h2></div>${documentTable(outstanding(state, 'in').filter(d => match(d, filter)).slice(0, 25), 'invoices', { compact: true })}</section><section class="card"><div class="section-title"><h2>Pending supplier payments</h2></div>${documentTable(outstanding(state, 'out').filter(d => match(d, filter)).slice(0, 25), 'purchases', { compact: true })}</section>`;
}
function renderAudit(state, filter) {
  const rows = [...state.audit].filter(row => !filter.search || `${row.label} ${row.type} ${row.user}`.toLowerCase().includes(filter.search.toLowerCase())).reverse();
  const page = pager(rows, filter);
  return `${pageHead('Activity log', 'A retained history of saves, payments and reversals.')}<section class="card">${field('Search activity', 'search', filter.search || '', 'id="list-search" data-filter="search" type="search"')}${rows.length ? `<ol class="activity-list">${page.rows.map(row => `<li><span class="activity-dot"></span><div><strong>${e(row.label || row.type)}</strong><small>${e(row.user || 'Owner')} · ${e(row.ts ? new Date(row.ts).toLocaleString('en-IN') : '')}</small>${row.details ? `<p>${e(row.details)}</p>` : ''}</div></li>`).join('')}</ol>` : empty('No activity yet')}${page.html}</section>`;
}

function masterForm(state, kind, id = '') {
  const row = state[kind].find(row => row.id === id) || {};
  const parties = kind === 'parties';
  return `<form id="master-form" data-kind="${kind}" data-id="${e(id)}" data-version="${e(row.updatedAt || '')}"><div class="form-grid">${field('Name', 'name', row.name, 'required autofocus class="master-name"')}${parties ? `<label class="field"><span>Party type</span><select name="type">${options(['customer', 'supplier', 'both'], row.type || 'both')}</select></label>${field('Phone', 'phone', row.phone, 'type="tel"')}${field('GSTIN', 'gstin', row.gstin)}${field('Opening balance', 'openingBal', row.openingBal || 0, 'type="number" step="0.01" inputmode="decimal"')}<p class="muted tiny">Positive = collect from party; negative = pay party.</p>${field('Address', 'address', row.address)}<p class="muted tiny">Opening-balance payments are tracked separately in the party ledger.</p>` : `${field('Unit', 'unit', row.unit || 'Pcs')}${field('Sale rate', 'saleRate', row.saleRate || 0, 'type="number" min="0" step="0.01" inputmode="decimal"')}${field('Purchase rate', 'purchaseRate', row.purchaseRate || 0, 'type="number" min="0" step="0.01" inputmode="decimal"')}${field('GST (%)', 'gst', row.gst || 0, 'type="number" min="0" max="100" step="0.01"')}${field('HSN', 'hsn', row.hsn)}${field('Brand / colour', 'colour', row.colour || row.brand)}${field('SKU', 'sku', row.sku)}`}</div><p class="form-error" role="alert"></p><div class="dialog-actions">${button('Cancel', 'close-dialog', '', 'subtle')}<button type="submit" class="button primary">Save ${parties ? 'party' : 'item'}</button></div></form>`;
}
function documentDetail(state, kind, id) {
  const doc = state[kind].find(row => row.id === id);
  if (!doc) throw new Error('Bill not found.');
  const sale = kind === 'invoices';
  const saved = (doc.payments || []).filter(p => !p.voidedAt);
  return `<div class="detail-heading"><div><h3>${e(doc.partyName || 'Cash')}</h3><p>${dateLabel(doc.date)}${doc.due ? ` · Due ${dateLabel(doc.due)}` : ''}</p></div>${badge(doc)}</div><div class="detail-metrics"><div><span>Total</span><strong>${currency(doc.total)}</strong></div><div><span>Paid / adjusted</span><strong>${currency(doc.paid)}</strong></div><div><span>Balance</span><strong>${currency(active(doc) ? doc.balance : 0)}</strong></div></div><div class="actions wrap">${button('Print', 'print-document', `data-kind="${kind}" data-id="${e(id)}"`, 'secondary')}${active(doc) ? button('Edit bill', 'edit-document', `data-kind="${kind}" data-id="${e(id)}"`, 'subtle') + (doc.balance > 0 && doc.dispatchStatus !== 'draft' ? button(sale ? 'Collect payment' : 'Payment out', 'open-payment', `data-kind="${kind}" data-id="${e(id)}"`, 'primary') : '') + (sale && doc.dispatchStatus !== 'draft' ? button(doc.dispatchStatus === 'dispatched' ? 'Mark pending' : 'Mark dispatched', 'document-status', `data-kind="${kind}" data-id="${e(id)}" data-status="${doc.dispatchStatus === 'dispatched' ? 'pending' : 'dispatched'}"`, 'subtle') : '') + button('Cancel bill', 'document-status', `data-kind="${kind}" data-id="${e(id)}" data-status="cancelled"`, 'subtle danger') : button('Restore bill', 'document-status', `data-kind="${kind}" data-id="${e(id)}" data-status="restored"`, 'primary')}</div>
    ${(doc.items || []).length ? `<div class="table-wrap"><table><thead><tr><th>Item</th><th>Qty</th><th>Rate</th><th class="number">Amount</th></tr></thead><tbody>${doc.items.map(item => `<tr><td>${e(item.name)}<small>${e([item.colour, item.packType, item.packCount ? `${item.packCount} packs` : ''].filter(Boolean).join(' · '))}</small></td><td>${e(item.qty)} ${e(item.unit)}</td><td>${currency(item.rate)}</td><td class="number">${currency(item.amt)}</td></tr>`).join('')}</tbody></table></div>` : '<p class="info-strip">Amount-only bill</p>'}<div class="detail-summary"><span>Subtotal ${currency(doc.subtotal ?? doc.total)}</span><span>Discount ${currency(doc.discount)}</span><span>Tax ${currency(doc.taxAmt)}</span></div>${doc.notes ? `<p class="notes">${e(doc.notes)}</p>` : ''}${doc.photoData && /^data:image\/(png|jpeg|webp);base64,/.test(doc.photoData) ? `<details><summary>View supplier bill photo</summary><img class="bill-photo" src="${e(doc.photoData)}" alt="Supplier bill attachment"></details>` : ''}<h3 class="subheading">Payment history</h3>${saved.length ? `<div class="payment-history">${saved.map(payment => `<div><span><strong>${dateLabel(payment.date)}</strong><small>${e(payment.mode)} · ${e(payment.note)}</small></span><strong>${currency(payment.amt)}</strong>${active(doc) ? button('Reverse', 'void-payment', `data-kind="${kind}" data-id="${e(id)}" data-payment="${e(payment.id)}"`, 'subtle danger') : ''}</div>`).join('')}</div>` : '<p class="muted">No payments recorded.</p>'}`;
}
function partyLedger(state, id) {
  const party = state.parties.find(row => row.id === id);
  if (!party) throw new Error('Party not found.');
  const balance = partyBalance(state, party);
  const rows = transactions(state).filter(row => row.partyId === id);
  const openingPaid = state.openingPayments.filter(p => p.partyId === id && !p.voidedAt).reduce((sum, p) => sum + cents(p.amt), 0);
  const openingDue = Math.max(0, Math.abs(cents(party.openingBal)) - openingPaid) / 100;
  return `<div class="detail-heading"><div><h3>${e(party.name)}</h3><p>${e(party.phone || '')} ${e(party.gstin || '')}</p></div><div class="ledger-balance"><small>${balance >= 0 ? 'Net amount to collect' : 'Net amount to pay'}</small><strong>${currency(Math.abs(balance))}</strong></div></div><div class="actions wrap">${button('New sale', 'new-for-party', `data-kind="invoices" data-id="${e(id)}"`, 'primary')}${button('New purchase', 'new-for-party', `data-kind="purchases" data-id="${e(id)}"`, 'secondary')}${button('Payment in', 'open-payment', `data-direction="in" data-party="${e(id)}"`, 'subtle')}${button('Payment out', 'open-payment', `data-direction="out" data-party="${e(id)}"`, 'subtle')}${openingDue > 0 ? button('Settle opening balance', 'opening-payment', `data-id="${e(id)}"`, 'subtle') : ''}</div><p class="info-strip">Opening balance: ${currency(party.openingBal)} · Opening amount still due: ${currency(openingDue)}. Sales add to the balance; purchases reduce it.</p>${rows.length ? `<div class="table-wrap"><table class="responsive-table"><thead><tr><th>Date / type</th><th>Reference</th><th class="number">Amount</th><th>Mode</th></tr></thead><tbody>${rows.map(row => `<tr><td data-label="Date">${dateLabel(row.date)}<small>${e(row.type)}${row.cancelled ? ' · cancelled' : ''}</small></td><td data-label="Reference">${row.collection ? `<button class="text-button" data-action="view-document" data-kind="${row.collection}" data-id="${e(row.documentId || row.id)}">${e(row.reference)}</button>` : e(row.reference)}</td><td class="number" data-label="Amount">${currency(row.amount)}</td><td data-label="Mode">${e(row.mode || '—')}${!row.collection && row.amt != null ? button('Reverse', 'void-payment', `data-kind="openingPayments" data-payment="${e(row.id)}" data-id="${e(id)}"`, 'subtle') : ''}</td></tr>`).join('')}</tbody></table></div>` : empty('No transactions for this party')}`;
}
function renderPriceHistory(state, editor, lineId) {
  const line = editor.draft.items.find(row => row.id === lineId);

  const rates = priceHistory(state, line, editor.draft.partyId, 5, editor.kind);
  return `<p class="info-strip">${editor.draft.partyId ? 'Prices for the selected party' : 'Prices across all parties'} · ${e(line.unit || 'Pcs')} · Recorded unit rates, before bill-level discounts / tax.</p>${rates.length ? `<div class="price-options">${rates.map(rate => `<div><span><strong>${currency(rate.rate)} / ${e(rate.unit)}</strong><small>${e(rate.partyName)} · ${dateLabel(rate.date)} · ${e(rate.invoiceNo)}</small></span>${button('Use price', 'use-price', `data-line="${e(lineId)}" data-rate="${rate.rate}"`, 'secondary')}</div>`).join('')}</div>` : empty('No earlier price', 'No matching item, unit, brand and party found in active bills.')}`;

function paymentForm(state, direction = 'in', partyId = '', documentId = '') {

function openingPaymentForm(state, partyId) {
  const party = state.parties.find(row => row.id === partyId);

}

function renderSettings(state) {
  const settings = state.settings;
  return `${pageHead('Business settings', 'Business details, invoice defaults and print preferences.')}<form id="settings-form" data-version="${e(settings.updatedAt || '')}" data-counter="${e(settings.invNo)}"><section class="card"><div class="section-title"><h2>Business profile</h2></div><div class="form-grid">${field('Business name', 'shopName', settings.shopName, 'required')}${field('Owner', 'owner', settings.owner)}${field('Phone', 'phone', settings.phone, 'type="tel"')}${field('GSTIN', 'gstin', settings.gstin)}${field('State', 'state', settings.state)}${field('Financial year', 'fy', settings.fy)}<label class="field span-2"><span>Business address</span><textarea name="address" rows="2">${e(settings.address)}</textarea></label></div></section><section class="card"><div class="section-title"><h2>Invoice defaults</h2></div><div class="form-grid">${field('Invoice prefix', 'prefix', settings.prefix)}${field('Next invoice number', 'invNo', settings.invNo, 'type="number" min="1" step="1" required')}<label class="field span-2"><span>Bank / UPI details</span><textarea name="bank" rows="2">${e(settings.bank)}</textarea></label><label class="field span-2"><span>Terms and conditions</span><textarea name="terms" rows="3">${e(settings.terms)}</textarea></label></div><div class="checkbox-grid">${[['packing', 'Packing fields'], ['dispatch', 'Dispatch tracking'], ['retail', 'Retail entries'], ['gst', 'Bill-level tax field']].map(([name, label]) => `<label class="check"><input type="checkbox" name="module:${name}" ${settings.modules?.[name] !== false ? 'checked' : ''}>${label}</label>`).join('')}</div><p class="muted tiny">This version retains the original bill-level tax model. Item GST defaults are stored in your catalogue.</p></section><section class="card"><div class="section-title"><h2>Print preferences</h2></div><div class="form-grid"><label class="field"><span>Paper width</span><select name="print:paper">${options(['A4', '80mm'], settings.printSettings?.paper || 'A4')}</select></label></div><div class="checkbox-grid">${[['showPacking', 'Packing on invoice'], ['showBrand', 'Brand on invoice'], ['showBank', 'Bank details'], ['showTerms', 'Terms']].map(([name, label]) => `<label class="check"><input type="checkbox" name="print:${name}" ${settings.printSettings?.[name] !== false ? 'checked' : ''}>${label}</label>`).join('')}</div></section><section class="card"><div class="section-title"><h2>Custom invoice fields</h2>${button('Add field', 'add-custom-field', '', 'subtle')}</div><div id="custom-fields">${(settings.customFields || []).map(cf => customFieldRow(cf)).join('')}</div></section><p class="form-error" id="settings-error" role="alert"></p><div class="actions"><button type="submit" class="button primary">Save settings</button></div></form>`;
}
function customFieldRow(cf) {
  return `<div class="custom-row" data-custom-id="${e(cf.id)}">${field('Label', 'label', cf.label, 'required')}<label class="field"><span>Type</span><select name="type">${options(['text', 'number', 'date'], cf.type)}</select></label>${button('Remove', 'remove-custom-field', '', 'subtle danger')}</div>`;
}
function renderData(store, cloud) {
  const counts = ['invoices', 'purchases', 'parties', 'items'].map(name => `${store.data[name].length} ${name}`).join(' · ');
  return `${pageHead('Data & sync', 'Back up your business, import data and connect your devices.')}
  <section class="card"><div class="section-title"><div><h2>Your billing data</h2><p class="muted">${e(counts)}</p></div><span class="badge neutral">Revision ${store.envelope.revision}</span></div><p class="info-strip">${store.envelope.ownerId ? 'Cloud workspace. Bills can be posted after signing in to this account.' : 'Device-only mode. These bills stay in this browser until you connect cloud storage.'}</p><div class="actions wrap">${button('Download full backup', 'export-backup', '', 'primary')}<label class="button secondary">Restore JSON backup<input class="visually-hidden" id="backup-file" type="file" accept="application/json,.json"></label>${button('Export all transactions CSV', 'export-csv', 'data-type="transactions"', 'subtle')}</div><p class="muted tiny">Backups include bill photos, payments, opening balances and activity history. Old shop4_* browser data is retained as a migration recovery copy.</p></section>
  <section class="card"><div class="section-title"><h2>Connect PC & mobile</h2><span class="badge neutral">${cloud.connected ? e(cloud.session.user.email || 'Signed in') : 'Not connected'}</span></div><p class="muted">Use the same billing email and password on both devices. Your bills sync through your business cloud database.</p><p class="info-strip">A connection is required to post cloud bills. Unfinished drafts stay on this device. Other devices check for changes every 8 seconds.</p>
  ${cloud.connected ? `<div class="actions wrap">${button('Refresh now', 'refresh-cloud', '', 'secondary')}${button('Use cloud data', 'use-cloud', '', 'subtle')}${button('Sign out', 'sign-out', '', 'subtle')}</div>` : cloud.configured ? `<form id="billing-login-form"><div class="form-grid"><label class="field"><span>Billing email</span><input id="billing-email" name="email" type="email" autocomplete="username" required></label><label class="field"><span>Password</span><input name="password" type="password" autocomplete="current-password" required></label></div><p class="form-error" role="alert"></p><div class="actions"><button type="submit" class="button primary">Sign in</button>${button('Forgot password?', 'reset-password', '', 'subtle')}</div></form>` : '<p class="muted">Cloud login is awaiting setup. Your entries remain on this device; download a full backup regularly.</p>'}
  ${store.error ? `<p class="form-error" role="alert">${e(store.error)}</p>` : ''}${store.pending ? `<div class="pending-box"><strong>A save needs attention</strong><p>${e(store.pending.type)} · ${e(store.pending.at)}</p><div class="actions">${button('Retry pending save', 'retry-save', '', 'primary')}${button('Download pending operation', 'export-pending', '', 'subtle')}</div></div>` : ''}</section>
  <section class="card"><div class="section-title"><h2>Google Drive & Sheets</h2></div><p class="muted">Save a full backup to your Drive or refresh spreadsheet reports through the optional Google integration.</p><div class="actions wrap">${button('Back up to Drive', 'google-export', `data-type="backup" ${!cloud.googleConfigured ? 'disabled' : ''}`, 'secondary')}${button('Update Google Sheets', 'google-export', `data-type="sheets" ${!cloud.googleConfigured ? 'disabled' : ''}`, 'subtle')}</div><p class="muted tiny">${cloud.googleConfigured ? 'Your Google connection is configured.' : 'Connect your Google account to enable these exports.'} Google credentials stay on the server. A failed export does not affect saved bills.</p></section>
  <section class="card"><div class="section-title"><h2>Import from Excel CSV</h2></div><p class="muted">Save your Excel sheet as UTF-8 CSV. Use your exported items/parties file as a template. Existing IDs update matching records; blank IDs add new records.</p><form id="csv-form"><div class="form-grid"><label class="field"><span>Data type</span><select name="kind">${options(['items', 'parties'], 'items')}</select></label><label class="field span-2"><span>CSV file (up to 500 rows)</span><input name="file" type="file" accept="text/csv,.csv" required></label></div><p class="form-error" role="alert"></p><button type="submit" class="button secondary">Review CSV import</button></form></section>`;
}


let demoState = {"schemaVersion":2,"settings":{"shopName":"XL Billing · Demo","owner":"","address":"","phone":"","gstin":"","state":"","prefix":"INV-","invNo":1002,"fy":"2026-27","terms":"","bank":"","customFields":[],"modules":{"packing":true,"dispatch":true,"retail":true,"gst":true},"printSettings":{}},"items":[{"id":"demo-cups","name":"Demo Paper Cups","unit":"Pcs","saleRate":8,"purchaseRate":6,"colour":"Demo brand"}],"parties":[{"id":"demo-customer","name":"Demo Customer","type":"customer","openingBal":0,"phone":""},{"id":"demo-supplier","name":"Demo Supplier","type":"supplier","openingBal":0,"phone":""}],"invoices":[{"date":"2026-10-09","partyId":"demo-customer","partyName":"Demo Customer","items":[{"id":"sample-line","itemId":"demo-cups","name":"Demo Paper Cups","unit":"Pcs","colour":"Demo brand","qty":100,"rate":8,"amt":800}],"discount":0,"taxPct":0,"dispatchStatus":"pending","subtotal":800,"taxAmt":0,"total":800,"partySnapshot":{"name":"Demo Customer","address":"","phone":"","gstin":""},"id":"sample-sale","invoiceNo":"INV-1001","payments":[{"id":"sample-sale-paid","date":"2026-10-09","amt":200,"mode":"Cash","note":"At billing"}],"mode":"items","customFieldValues":{},"createdAt":"2026-10-09T13:15:14.513Z","updatedAt":"2026-10-09T13:15:14.513Z","version":1,"paid":200,"balance":600}],"purchases":[],"retail":[],"audit":[{"id":"sample-sale","type":"save-document","entityType":"invoices","entityId":"sample-sale","label":"Created INV-1001","details":"","ts":"2026-10-09T13:15:14.513Z","user":"Owner"}],"openingPayments":[]};
let demoPage = 'new-sale', demoFilter = {}, demoEditor;
const demoCloud = { configured:true,connected:false,available:true,googleConfigured:false };
function freshEditor(kind, record) {
  const party = demoState.parties.find(p=>p.id===(kind==='invoices'?'demo-customer':'demo-supplier'));
  return { kind, draft:record ? {...clone(record),expectedVersion:record.version,initialPaid:0} : {date:today(),due:'',partyId:party.id,partyName:party.name,invoiceNo:'',billNo:'',dispatchStatus:'pending',isManual:false,items:[{...newLine(),itemId:'demo-cups',name:'Demo Paper Cups',unit:'Pcs',colour:'Demo brand',qty:100,rate:kind==='invoices'?8:6}],discount:0,taxPct:0,initialPaid:0,paymentType:'Cash',notes:'',customFieldValues:{}} };
}
function demoRender() {
  const view=document.getElementById('view');
  view.innerHTML = demoEditor ? renderEditor(demoEditor,demoState) : demoPage==='dashboard'?renderDashboard(demoState):demoPage==='sales'||demoPage==='purchases'?renderDocuments(demoState,demoPage==='sales'?'invoices':'purchases',demoFilter):demoPage==='parties'||demoPage==='items'?renderMasters(demoState,demoPage,demoFilter):demoPage==='data'?renderData({data:demoState,envelope:{revision:1}},demoCloud):demoPage==='settings'?renderSettings(demoState):demoPage==='reports'?renderReports(demoState,demoFilter):demoPage==='audit'?renderAudit(demoState,demoFilter):demoPage==='retail'?renderRetail(demoState,demoFilter):demoPage.startsWith('bulk-')?renderBulk(demoPage==='bulk-sales'?'invoices':'purchases',demoState):renderTransactions(demoState,demoFilter,demoPage==='payment-in'?'in':demoPage==='payment-out'?'out':'all');
  document.getElementById('desktop-navigation').innerHTML=navigation.map(([label,links])=>'<div class="nav-group"><small>'+label+'</small>'+links.map(([name,text])=>'<a href="#'+name+'" '+(name===demoPage?'aria-current="page"':'')+'>'+text+'</a>').join('')+'</div>').join('');
  document.getElementById('mobile-navigation').innerHTML=[['dashboard','Home'],['sales','Sales'],['parties','Parties'],['items','Items']].map(([name,text])=>'<a href="#'+name+'" '+(name===demoPage?'aria-current="page"':'')+'>'+text+'</a>').join('')+'<button type="button" data-action="toggle-menu">More</button>';
  document.getElementById('business-name').textContent=demoState.settings.shopName;
  document.getElementById('section-name').textContent=demoEditor?'Invoice preview':'Design preview';
  const banner=document.getElementById('status-banner'); banner.hidden=false; banner.textContent='DESIGN PREVIEW · Sample data only. Nothing is stored or sent. Do not enter real passwords or billing data.';
  if(demoEditor){updateEditorView(demoEditor,demoState);document.getElementById('draft-status').textContent='Preview only · not stored';}
}
function demoNavigate(page) { demoPage=page;demoFilter={};demoEditor=page==='new-sale'||page==='new-purchase'?freshEditor(page==='new-sale'?'invoices':'purchases'):null;document.getElementById('app-shell').classList.remove('menu-open');demoRender();window.scrollTo(0,0); }
document.addEventListener('click',event=>{
  const link=event.target.closest('a[href^="#"]');if(link){event.preventDefault();demoNavigate(link.getAttribute('href').slice(1));return;}
  const target=event.target.closest('[data-action]');if(!target)return;event.preventDefault();
  const action=target.dataset.action,kind=target.dataset.kind,id=target.dataset.id;
  if(action==='navigate')demoNavigate(target.dataset.page);
  else if(action==='toggle-menu')document.getElementById('app-shell').classList.toggle('menu-open');
  else if(action==='close-menu')document.getElementById('app-shell').classList.remove('menu-open');
  else if(action==='close-dialog')document.getElementById('dialog').close();
  else if(action==='add-line'){demoEditor.draft.items.push(newLine());demoRender();}
  else if(action==='reset-editor'){demoEditor=freshEditor(demoEditor.kind);demoRender();}
  else if(action==='remove-line'){demoEditor.draft.items=demoEditor.draft.items.filter(line=>line.id!==target.dataset.line);demoRender();}
  else if(action==='move-line'){const items=demoEditor.draft.items,index=items.findIndex(line=>line.id===target.dataset.line),next=index+Number(target.dataset.step);if(next>=0&&next<items.length){[items[index],items[next]]=[items[next],items[index]];demoRender();}}
  else if(action==='price-history')openDialog('Last item prices',renderPriceHistory(demoState,demoEditor,target.dataset.line));
  else if(action==='use-price'){demoEditor.draft.items.find(line=>line.id===target.dataset.line).rate=Number(target.dataset.rate);document.getElementById('dialog').close();demoRender();}
  else if(action==='party-ledger')openDialog('Demo party ledger',partyLedger(demoState,id),true);
  else if(action==='view-document')openDialog('Demo bill details',documentDetail(demoState,kind,id),true);
  else if(action==='edit-document'){demoEditor=freshEditor(kind,demoState[kind].find(row=>row.id===id));demoPage=kind==='invoices'?'new-sale':'new-purchase';document.getElementById('dialog').close();demoRender();}
  else if(action==='page-list'){demoFilter.page=Math.max(1,(demoFilter.page||1)+Number(target.dataset.step));demoRender();}
  else if(action==='clear-filter'){demoFilter={};demoRender();}
  else toast('Design preview only. This action uses no real data or cloud service.');
});
document.addEventListener('input',event=>{
  const target=event.target;if(!demoEditor||!target.name||target.type==='file')return;
  const row=target.closest('[data-line-id]');
  if(row){const line=demoEditor.draft.items.find(line=>line.id===row.dataset.lineId);line[target.name]=['qty','rate'].includes(target.name)?Number(target.value):target.value;}
  else if(target.name==='partyName')Object.assign(demoEditor.draft,resolveParty(demoState,target.value));
  else if(target.name==='isManual')demoEditor.draft.isManual=target.value==='Amount only';
  else demoEditor.draft[target.name]=target.value;
  updateEditorView(demoEditor,demoState);
});
document.addEventListener('change',event=>{
  if(event.target.dataset.filter){demoFilter[event.target.dataset.filter]=event.target.value;demoRender();}
  if(demoEditor&&event.target.name==='isManual')demoRender();
});
document.addEventListener('submit',event=>{
  event.preventDefault();
  if(event.target.id==='invoice-form'){
    try{const kind=demoEditor.kind;demoState=applyCommand(demoState,{id:uid(),at:new Date().toISOString(),type:'save-document',collection:kind,payload:clone(demoEditor.draft)});demoNavigate(kind==='invoices'?'sales':'purchases');toast('Sample bill added to this preview only. Nothing is stored.');}catch(error){toast(error.message,true);}
  }else{if(event.target.elements.password)event.target.elements.password.value='';toast('Preview only. No information was sent or saved.');}
});
demoEditor=freshEditor('invoices');demoRender();
</script></body>
