<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0c6d59">
  <meta name="description" content="XL Billing — sales, purchases, parties and payments for your business.">
  <title>XL Billing</title>
  <link rel="stylesheet" href="./styles/app.css">
  <link rel="manifest" href="./manifest.webmanifest">
  <script type="module" src="./src/main.js"></script>
</head>
<body>
  <a class="skip-link" href="#view">Skip to content</a>
  <div class="app-shell" id="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="Main navigation">
      <a class="brand" href="#dashboard"><span class="brand-mark">XL</span><span><strong id="business-name">My Shop</strong><small id="business-owner">Billing workspace</small></span></a>
      <nav id="desktop-navigation"></nav>
      <div class="sidebar-footer"><span class="connection-dot" id="sidebar-dot"></span><span id="sidebar-status">On this device</span></div>
    </aside>
    <button type="button" class="drawer-backdrop" data-action="close-menu" aria-label="Close navigation"></button>
    <div class="workspace">
      <header class="topbar"><div class="topbar-left"><button type="button" class="button mobile-menu" data-action="toggle-menu" aria-controls="sidebar" aria-expanded="false">Menu</button><div><strong id="section-name">Overview</strong><small>XL Billing</small></div></div><div class="topbar-actions"><button type="button" class="sync-pill" id="sync-status" data-action="navigate" data-page="data">On this device</button><button type="button" class="button primary header-create" data-action="navigate" data-page="new-sale">+ Sale invoice</button></div></header>
      <div class="status-banner" id="status-banner" role="status" hidden></div>
      <main id="view" class="view" tabindex="-1" aria-label="Billing workspace"><div class="empty"><h1>Opening your billing workspace…</h1></div></main>
    </div>
  </div>
  <nav class="mobile-navigation" id="mobile-navigation" aria-label="Mobile navigation"></nav>
  <dialog id="dialog" class="dialog" aria-label="Billing details"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="print-area"></div>
  <noscript>Enable JavaScript to use XL Billing. Your saved data is not changed when JavaScript is disabled.</noscript>
</body>
</html>
