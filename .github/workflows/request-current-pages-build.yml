name: Request current original-app Pages build
on:
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]
permissions:
  contents: read
  pages: write
jobs:
  request-current-build:
    if: github.event.workflow_run.id == 37925595086
    runs-on: ubuntu-latest
    steps:
      - name: Request a fresh build of the configured Pages source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh api --method POST "repos/$GH_REPO/pages/builds"
