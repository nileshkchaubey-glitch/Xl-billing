name: Billing regression tests
permissions:
  contents: read
on:
  pull_request:
  workflow_dispatch:
jobs:
  release1-safety-review:
    name: Release 1 data-safety gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # This fails while the documented safety defects remain unresolved.
      - run: npm run test:review
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release1-safety-review
          path: test/review/*.json
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: billing-test-evidence
          path: test-results/
