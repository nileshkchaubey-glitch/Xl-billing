name: Billing regression tests
permissions:
  contents: read
on:
  pull_request:
  workflow_dispatch:
jobs:
  release1-safety-review:
    name: Release 1 stabilization gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Stabilization and future-feature gates remain separate.
      - run: npm run test:stabilization
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release1-safety-review
          path: test-results/review/*.json
  foundation-safety-review:
    name: Storage and backup acceptance gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:foundation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: foundation-safety-review
          path: test-results/review/*.json
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Native PDF verification tools
        run: |
          if [ ! -x /usr/bin/pdftotext ] || [ ! -x /usr/bin/pdfinfo ]; then
            sudo apt-get update
            sudo apt-get install -y poppler-utils
          fi
          dpkg-query -W poppler-utils
          /usr/bin/pdftotext -v
          /usr/bin/pdfinfo -v
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - name: Independent owner pre-merge gate
        run: |
          owner_gate_result=0
          for owner_gate_browser in chromium firefox webkit; do
            XL_REVIEW_BROWSER="$owner_gate_browser" node scripts/review-release1.cjs || owner_gate_result=1
            XL_PREMERGE_BROWSER="$owner_gate_browser" node scripts/verify-premerge.cjs || owner_gate_result=1
            XL_PM_REPORT_BROWSER="$owner_gate_browser" node scripts/verify-pm-reports.cjs || owner_gate_result=1
            XL_PAYMENT_IDENTITY_BROWSER="$owner_gate_browser" node scripts/verify-payment-identity.cjs || owner_gate_result=1
            XL_PARTY_CLICK_BROWSER="$owner_gate_browser" node scripts/verify-party-click.cjs || owner_gate_result=1
            XL_MOBILE_BROWSER="$owner_gate_browser" node scripts/verify-mobile.cjs || owner_gate_result=1
          done
          exit "$owner_gate_result"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: billing-test-evidence
          path: test-results/
