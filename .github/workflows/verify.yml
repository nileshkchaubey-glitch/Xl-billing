name: Verify billing rules
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/check.js
      - run: node --test tests/*.test.js
      - run: node scripts/build-worker.js
      - run: node scripts/validate-artifact.mjs
      - run: node scripts/smoke-worker.mjs
      - run: node scripts/build-preview.mjs
