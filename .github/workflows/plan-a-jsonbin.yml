name: Plan A2 JSONBin quarantine

on:
  pull_request:
    branches: [main]
    paths:
      - index.html
      - qa/**
      - storage-diagnostics.html
      - docs/PLAN_A_*.md
      - .github/workflows/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  a2:
    name: A2 synthetic and full-script browser acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      A2_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      A2_EVIDENCE_DIR: ${{ runner.temp }}/a2-evidence
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.23.3'
      - name: Verify actual head and authorized runtime revision
        run: |
          test "$(git rev-parse HEAD)" = "$A2_HEAD"
          node qa/plan-a2/verify-runtime-revision-tests.cjs
          node qa/plan-a2/verify-jsonbin-quarantine.cjs
      - name: Original baseline controls, fixtures and read-only diagnostics
        run: |
          node qa/plan-a/verify-evidence-runner.cjs
          node qa/plan-a/verify-historical-fixtures.cjs --runtime-revision qa/plan-a2/runtime-revision.json
          node qa/plan-a/verify-readonly-diagnostics.cjs --runtime-revision qa/plan-a2/runtime-revision.json
          node qa/plan-a/verify-baseline.cjs --runtime-revision qa/plan-a2/runtime-revision.json --evidence-dir "$RUNNER_TEMP/a2-baseline" --expected-head "$A2_HEAD"
      - name: Install isolated test-only browser tooling
        run: |
          mkdir -p "$RUNNER_TEMP/a2-browser-tools"
          npm install --prefix "$RUNNER_TEMP/a2-browser-tools" --no-save --no-package-lock playwright@1.64.0
          "$RUNNER_TEMP/a2-browser-tools/node_modules/.bin/playwright" install --with-deps chromium firefox webkit
          echo "NODE_PATH=$RUNNER_TEMP/a2-browser-tools/node_modules" >> "$GITHUB_ENV"
      - name: Full ordinary application JSONBin gates and backup compatibility
        run: node qa/plan-a2/verify-jsonbin-browser.cjs
      - name: Existing three-engine diagnostics visit and reload
        run: node qa/plan-a/verify-diagnostics-browser.cjs
      - name: Real invoice, receipt and print UI preservation against baseline
        run: node qa/plan-a2/verify-billing-browser.cjs
      - name: Retain actual-head failure and passing evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: a2-evidence-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/a2-baseline
            ${{ runner.temp }}/a2-evidence
          if-no-files-found: error
          retention-days: 14
