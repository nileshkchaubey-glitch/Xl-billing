name: Plan A3a verified folder backup (synthetic)

on:
  pull_request:
    branches: [main]
    paths:
      - verified-backup.html
      - qa/plan-a3a/**
      - docs/PLAN_A_A3A_VERIFICATION.md
      - .github/workflows/plan-a3a-backup.yml
      - index.html
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    name: A3a source pin, failures, and three browser engines
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      A3A_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out actual head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Node 22.23.3
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.23.3'
      - name: Verify candidate commit and V1 codec source integrity
        run: |
          test "$(git rev-parse HEAD)" = "$A3A_HEAD"
          node qa/plan-a3a/verify-backup-source.cjs
      - name: Install test-only Playwright and browser binaries
        run: |
          npm install --no-save --no-package-lock playwright@1.64.0
          npx playwright install --with-deps chromium firefox webkit
      - name: Verify synthetic browser picker and immutable file behavior
        run: node qa/plan-a3a/verify-backup-browser.cjs
