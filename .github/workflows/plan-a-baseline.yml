name: Plan A A1a synthetic baseline

on:
  pull_request:
    branches: [main]
    paths:
      - index.html
      - qa/**
      - docs/PLAN_A_*.md
      - .github/workflows/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    name: A1a inventory and synthetic evidence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PLAN_A_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out the actual proposed head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7, Node 24 action runtime
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Use the tested Node version
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7, Node 24 action runtime
        with:
          node-version: '22.23.3'
      - name: Verify synthetic historical fixtures
        run: node qa/plan-a/verify-historical-fixtures.cjs
      - name: Verify evidence runner failure reporting
        run: node qa/plan-a/verify-evidence-runner.cjs
      - name: Record immutable-source and existing QA evidence
        if: ${{ !cancelled() }}
        run: >-
          node qa/plan-a/verify-baseline.cjs
          --evidence-dir "${RUNNER_TEMP}/plan-a-evidence"
          --expected-head "${PLAN_A_EXPECTED_HEAD}"
      - name: Upload baseline evidence, including failures
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7, Node 24 action runtime
        with:
          name: plan-a-a1a-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/plan-a-evidence
          if-no-files-found: error
          retention-days: 14
