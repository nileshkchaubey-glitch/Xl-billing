name: Legacy backup import guard

on:
  pull_request:
    paths:
      - index.html
      - qa/verify-backup-import.cjs
      - .github/workflows/legacy-backup-import.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v4-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Node test syntax
        run: node --check qa/verify-backup-import.cjs
      - name: Test legacy backup import protection
        run: node qa/verify-backup-import.cjs
